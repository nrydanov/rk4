# Карта статьи, пересчитанная как следует. Дополняет config_fine.yaml, не
# заменяет его.
#
# Рисунки статьи посчитаны по старому config.yaml: сетка 201^2 при шаге 0.005,
# 30 начальных условий, t_transition = 240. Здесь то же поле расстроек и тот же
# набор eps, но втрое гуще сетка, втрое больше ансамбль и транзиент 640.

N: 3
mus: [0.1, 0.1, 0.1]
adj:
  - [0, 1, 1]
  - [1, 0, 0]
  - [1, 0, 0]

sim:
  # Транзиент 640 вместо 240, как в config_fine. По лестнице чекпойнтов
  # (config_converge, разбор в docs/convergence.md) убывание разности соседних
  # карт кончается около 640; дальше идти незачем, ближе — попадаем на участок,
  # где вклад переходного процесса ещё убывает.
  t_transition: 640
  # Окно наблюдения T - t_transition = 1360 то же, что в статье и в config_fine,
  # поэтому порог theta = 2*pi/1360 = 4.62e-3 переносится без пересчёта, и карты
  # прямо сопоставимы с прежними.
  T: 2000
  dt: 0.1

  # Всё поле расстроек, как в статье, а не центральное окно config_fine.
  d_min: -0.5
  d_max: 0.5
  # 401 точка по оси против 201 в статье. Мельче не имеет смысла: шаг 0.001 в
  # config_fine взят ради языка захвата при малых eps, но на карте размахом 1.0
  # такой язык занимает меньше процента оси и не разрешается ни при каком шаге —
  # это задача узкой карты. Полная сетка 1001^2 стоила бы 67 ч и 170 ГБ.
  d_step: 0.0025

  # Общий список для всех четырёх типов связи — тот, что просил научрук и по
  # которому построены рисунки статьи. Он сознательно отличается от раздельных
  # списков config_fine: там значения подобраны под физику каждого типа связи
  # (полуширина языка у диссипативной примерно равна eps, у инерционной вчетверо
  # меньше; порог гашения mu - eps*k_n существует только у диссипативной), а
  # здесь важнее прямая сопоставимость со статьёй. Раздельные списки на этом же
  # поле — отдельный прогон.
  epsilons: [0.01, 0.03, 0.05, 0.07, 0.10]

  # 100 вместо 30 в статье. Бассейн доли p пропускается с вероятностью (1-p)^n:
  # при 30 это 74% для p = 1%, при 100 — 37%. Мультистабильность заявлена
  # предметом работы, и мерить её по 30 начальным условиям несерьёзно.
  n_ic: 100
  ic_range: 3.0
  seed: 42
