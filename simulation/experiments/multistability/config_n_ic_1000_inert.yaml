# Продление лестницы по n_ic до 1000 для инерционной связи при eps=0.30.
#
# Зачем только одна группа. Прогон до n_ic=300 показал, что число различных
# режимов в ячейке растёт логарифмически, R(k) = a + b*ln k, с R^2 = 0.96..0.999
# внутри каждой из двенадцати групп (связь x eps), но НАКЛОНЫ b различаются
# между группами в 150 раз — от 0.00065 (диссипативная, eps=0.10) до 0.09689
# (инерционная, eps=0.30) при стандартных ошибках 3e-5..3e-3. Общего наклона
# нет, перенести результат с одной группы на другие нельзя, и попытка
# отмасштабировать b по уровню мультистабильности (b ~ a-1) тоже не проходит:
# отношение b/(a-1) равно 0.136 у инерционной при eps=0.30 и 0.466 у
# нормированной инерционной при том же eps.
#
# Поэтому считается не «типичная» группа, а худшая: инерционная eps=0.30 имеет
# и максимальный наклон, и худшую сходимость набора режимов (при k=30 финальный
# набор достигнут лишь в 81.8% ячеек против 99.9% у диссипативной eps=0.10).
# Это верхняя граница эффекта: если при n_ic=1000 картина здесь качественно не
# меняется, для остальных одиннадцати групп тем более.
#
# Кусок inert-eps0.3 покрывает сразу обе инерционные группы, Inertial и
# InertialNorm (нормировка на степень узла выбирается внутри бинарника, а не
# конфигом), то есть даёт разом наклоны 0.0969 и 0.0729 — два самых больших.
#
# Первые 300 начальных условий пересчитываются заново: поток RNG задаётся
# seed_seq{seed, i1, i2} и от n_ic не зависит, так что префикс воспроизводится
# побитово. Это не потеря, а побочная проверка — новый прогон обязан совпасть
# с уже посчитанным inert-eps0.3.csv.zst на общих 300 IC.
#
# Остальные параметры (сетка, t_transition, T, dt, ic_range, seed) совпадают с
# config_n_ic_converge.yaml — иначе лестница по k была бы несопоставима.

N: 3
mus: [0.1, 0.1, 0.1]
adj:
  - [0, 1, 1]
  - [1, 0, 0]
  - [1, 0, 0]

sim:
  t_transition: 640
  T: 2000
  dt: 0.0125

  d_min: -0.15
  d_max: 0.15
  d_step: 0.002

  epsilons_inertial: [0.30]
  epsilons_dissipative: []

  n_ic: 1000
  ic_range: 3.0
  seed: 42
