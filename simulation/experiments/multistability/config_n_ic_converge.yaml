# Проверка сходимости по числу начальных условий n_ic. В отличие от dt, не
# нужна лестница отдельных прогонов: генератор случайных чисел зависит только
# от (seed, i1, i2), не от n_ic, поэтому первые k наборов начальных условий
# при любом n_ic — это префикс одного и того же потока. Единственный прогон
# с n_ic=300 даёт все меньшие уровни (30, 100, ...) как подвыборку первых k
# строк внутри уже посчитанных данных, без пересчёта.
#
# n_ic_max=300, не 1000: по литературе (Menck 2013 и последующие работы по
# basin stability связанных осцилляторов) N=100 — уже стандартная практика,
# N=1000 — верхняя граница диапазона, не норма. 300 даёт 95% вероятность
# поймать 1%-й бассейн (см. коммит 45eac16) при втрое меньшей стоимости,
# чем 1000; если этого будет мало — можно досчитать позже, поток
# начальных условий детерминирован и продолжаем с того же места.
#
# Критерий сходимости — не сама q (она по построению растёт с n_ic почти
# всегда, это не признак ошибки), а кумулятивное число РАЗЛИЧНЫХ режимов R,
# обнаруженных в ячейке среди первых k решений: сходимость — это выход этой
# кривой на плато при некотором n <= 300, а не конкретное значение q.
#
# dt взят как самый мелкий уже настроенный уровень из dt-convergence
# (nrydanov/dt-convergence), чтобы не смешивать два источника погрешности в
# одном прогоне; при пересмотре dt по итогам того эксперимента может
# потребоваться перезапуск с другим значением.

N: 3
mus: [0.1, 0.1, 0.1]
adj:
  - [0, 1, 1]
  - [1, 0, 0]
  - [1, 0, 0]

sim:
  t_transition: 640
  T: 2000
  dt: 0.005

  # Та же уменьшенная карта расстроек и тот же сжатый список eps, что и в
  # dt-convergence — прямая сопоставимость между двумя проверками.
  d_min: -0.15
  d_max: 0.15
  d_step: 0.002

  epsilons_inertial: [0.02, 0.10, 0.30]
  epsilons_dissipative: [0.01, 0.05, 0.10]

  n_ic: 300
  ic_range: 3.0
  seed: 42
