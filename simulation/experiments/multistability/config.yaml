N: 3
mus: [0.1, 0.1, 0.1]
adj:
  - [0, 1, 1]
  - [1, 0, 0]
  - [1, 0, 0]

sim:
  # Время переходного процесса
  t_transition: 240
  # Общее время наблюдениц
  T: 1600
  # Шаг дискретизации времени
  dt: 0.05
  # Шаг перебора сетки расстройки частот
  d_step: 0.005
  # Минимальная расстройка частот
  d_min: -0.5
  # Максимальная расстройка частот
  d_max: 0.5
  # Рассматриваемые значения силы связи
  epsilons: [0.01, 0.03, 0.05, 0.07, 0.10]
  # Количество начальный условий
  n_ic: 30
  # Диапазон генерации начальных условий: [-ic_range; ic_range]
  ic_range: 3.0
  # Для воспроизводимости экспериментов
  seed: 42
